<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="wmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="800" fill="#ffffff"/>
  <text x="590" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">yaml/world.yaml — room graph (10 rooms, 1 loop + 3 branches)</text>
  <text x="590" y="48" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6b7280">same grid as the in-game minimap (gui/map.go) — every exit shown below is bidirectional</text>

  <!-- edges (drawn first so node boxes overlap the ends) -->
  <g stroke="#374151" stroke-width="1.8" marker-end="url(#wmArrow)" marker-start="url(#wmArrow)">
    <line x1="120" y1="150" x2="580" y2="150"/>            <!-- Lumière - Vallées fleuries -->
    <line x1="120" y1="150" x2="120" y2="620"/>             <!-- Lumière - Vieille Lumière -->
    <line x1="580" y1="150" x2="810" y2="150"/>             <!-- Vallées fleuries - Plage -->
    <line x1="580" y1="150" x2="580" y2="380"/>             <!-- Vallées fleuries - Océan suspendu -->
    <line x1="580" y1="380" x2="350" y2="380"/>             <!-- Océan suspendu - Nid d'Esquie -->
    <line x1="580" y1="380" x2="810" y2="380"/>             <!-- Océan suspendu - Village Gestral -->
    <line x1="810" y1="380" x2="1040" y2="380"/>            <!-- Village Gestral - Cimetière Gestral -->
    <line x1="810" y1="380" x2="810" y2="620"/>             <!-- Village Gestral - Rochevague -->
    <line x1="810" y1="620" x2="580" y2="620"/>             <!-- Rochevague - Terres oubliées -->
    <line x1="580" y1="620" x2="120" y2="620"/>             <!-- Terres oubliées - Vieille Lumière -->
  </g>

  <!-- nodes: box, title, subtitle. category colors: quest-giver=violet, dialogue=blue, enemy=red, plain=slate -->
  <g text-anchor="middle">
    <!-- Lumière : quest-giver -->
    <rect x="22" y="92" width="196" height="96" rx="10" fill="#f5f0ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="120" y="122" font-size="14" font-weight="bold" fill="#4c1d95">Lumière</text>
    <text x="120" y="140" font-size="10" fill="#4c1d95">start / respawn room</text>
    <text x="120" y="157" font-size="10" fill="#4c1d95">NPC: Sophie (quest-giver)</text>

    <!-- Vallées fleuries : enemy + item -->
    <rect x="482" y="92" width="196" height="96" rx="10" fill="#fff1f1" stroke="#dc2626" stroke-width="1.8"/>
    <text x="580" y="122" font-size="14" font-weight="bold" fill="#7f1d1d">Vallées fleuries</text>
    <text x="580" y="140" font-size="10" fill="#7f1d1d">Enemy: Névron (easy)</text>
    <text x="580" y="157" font-size="10" fill="#7f1d1d">Item: Lumina</text>

    <!-- Plage : item, branch -->
    <rect x="712" y="92" width="196" height="96" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="810" y="122" font-size="14" font-weight="bold" fill="#334155">Plage</text>
    <text x="810" y="140" font-size="10" fill="#334155">optional branch (dead end)</text>
    <text x="810" y="157" font-size="10" fill="#334155">Item: Abysseram</text>

    <!-- Nid d'Esquie : dialogue, branch -->
    <rect x="252" y="332" width="196" height="96" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="350" y="362" font-size="14" font-weight="bold" fill="#1e3a8a">Nid d'Esquie</text>
    <text x="350" y="380" font-size="10" fill="#1e3a8a">optional branch (dead end)</text>
    <text x="350" y="397" font-size="10" fill="#1e3a8a">NPC: Esquie (dialogue)</text>

    <!-- Océan suspendu : crossroads -->
    <rect x="482" y="332" width="196" height="96" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="580" y="362" font-size="14" font-weight="bold" fill="#334155">Océan suspendu</text>
    <text x="580" y="380" font-size="10" fill="#334155">crossroads — 3 exits</text>
    <text x="580" y="397" font-size="10" fill="#334155">no NPC / item</text>

    <!-- Village Gestral : item -->
    <rect x="712" y="332" width="196" height="96" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="810" y="362" font-size="14" font-weight="bold" fill="#334155">Village Gestral</text>
    <text x="810" y="380" font-size="10" fill="#334155">crossroads — 3 exits</text>
    <text x="810" y="397" font-size="10" fill="#334155">Item: Pictos</text>

    <!-- Cimetière Gestral : enemy, branch -->
    <rect x="942" y="332" width="196" height="96" rx="10" fill="#fff1f1" stroke="#dc2626" stroke-width="1.8"/>
    <text x="1040" y="362" font-size="14" font-weight="bold" fill="#7f1d1d">Cimetière Gestral</text>
    <text x="1040" y="380" font-size="10" fill="#7f1d1d">optional branch (dead end)</text>
    <text x="1040" y="397" font-size="10" fill="#7f1d1d">Enemy: Renoir (medium)</text>

    <!-- Vieille Lumière : enemy -->
    <rect x="22" y="572" width="196" height="96" rx="10" fill="#fff1f1" stroke="#dc2626" stroke-width="1.8"/>
    <text x="120" y="602" font-size="14" font-weight="bold" fill="#7f1d1d">Vieille Lumière</text>
    <text x="120" y="620" font-size="10" fill="#7f1d1d">closes the loop to Lumière</text>
    <text x="120" y="637" font-size="10" fill="#7f1d1d">Enemy: Peintress (extreme)</text>

    <!-- Terres oubliées : plain -->
    <rect x="482" y="572" width="196" height="96" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="580" y="602" font-size="14" font-weight="bold" fill="#334155">Terres oubliées</text>
    <text x="580" y="620" font-size="10" fill="#334155">passage room</text>
    <text x="580" y="637" font-size="10" fill="#334155">no NPC / item</text>

    <!-- Rochevague : item -->
    <rect x="712" y="572" width="196" height="96" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="810" y="602" font-size="14" font-weight="bold" fill="#334155">Rochevague</text>
    <text x="810" y="620" font-size="10" fill="#334155">passage room</text>
    <text x="810" y="637" font-size="10" fill="#334155">Item: Chroma</text>
  </g>

  <!-- edge labels: drawn after the nodes so their halo/text is never clipped by a room box -->
  <g font-size="10.5" fill="#374151" text-anchor="middle">
    <!-- long edges (span an empty grid cell, plenty of clearance either side): full compass labels -->
    <rect x="315" y="138" width="90" height="16" fill="#ffffff"/><text x="360" y="150">east ⇄ west</text>
    <rect x="90" y="378" width="70" height="16" fill="#ffffff"/><text x="125" y="390" transform="rotate(-90 125 390)">south ⇄ north</text>
    <rect x="545" y="258" width="70" height="16" fill="#ffffff"/><text x="580" y="270" transform="rotate(-90 580 270)">south ⇄ north</text>
    <rect x="775" y="493" width="70" height="16" fill="#ffffff"/><text x="810" y="505" transform="rotate(-90 810 505)">south ⇄ north</text>
    <rect x="305" y="608" width="90" height="16" fill="#ffffff"/><text x="350" y="620">west ⇄ east</text>
    <!-- short edges between directly adjacent boxes (only ~34px of gap): compact arrow only, so the
         label can never spill into either room box's own text -->
    <rect x="684" y="142" width="22" height="14" fill="#ffffff"/><text x="695" y="152" font-size="13">⇄</text>
    <rect x="454" y="373" width="22" height="14" fill="#ffffff"/><text x="465" y="383" font-size="13">⇄</text>
    <rect x="684" y="373" width="22" height="14" fill="#ffffff"/><text x="695" y="383" font-size="13">⇄</text>
    <rect x="914" y="373" width="22" height="14" fill="#ffffff"/><text x="925" y="383" font-size="13">⇄</text>
    <rect x="684" y="613" width="22" height="14" fill="#ffffff"/><text x="695" y="623" font-size="13">⇄</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#111827">
    <rect x="22" y="706" width="18" height="18" rx="4" fill="#f5f0ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="46" y="720">quest-giver NPC</text>
    <rect x="212" y="706" width="18" height="18" rx="4" fill="#eef4ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="236" y="720">dialogue NPC</text>
    <rect x="382" y="706" width="18" height="18" rx="4" fill="#fff1f1" stroke="#dc2626" stroke-width="1.6"/>
    <text x="406" y="720">hostile NPC (enemy)</text>
    <rect x="602" y="706" width="18" height="18" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <text x="626" y="720">no NPC</text>
    <text x="22" y="752" font-style="italic" fill="#374151">Loop: Lumière → Vallées fleuries → Océan suspendu → Village Gestral → Rochevague → Terres oubliées → Vieille Lumière → Lumière.</text>
    <text x="22" y="770" font-style="italic" fill="#374151">Branches: Plage, Nid d'Esquie, Cimetière Gestral — dead ends reachable only by backtracking through the loop.</text>
  </g>
</svg>
