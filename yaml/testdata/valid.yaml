# Fixture : un petit monde entièrement valide (locations, items, npcs,
# enemies, players, quests). Doit produire zéro erreur de validation.

world:
  locations:
    village:
      name: "Village"
      description: "A quiet village square."
      exits:
        east: "forest"
      npcs: ["elder"]
      items: ["potion"]

    forest:
      name: "Forest"
      description: "A dense, quiet forest."
      exits:
        west: "village"
      enemies: ["wolf"]

items:
  potion:
    name: "Potion"
    description: "Restores a bit of health."
    obtainable: true

npcs:
  elder:
    name: "Elder"
    role: "quest_giver"
    description: "An old villager who remembers everything."
    dialogue:
      - "Bring me a potion, will you?"

enemies:
  wolf:
    name: "Wolf"
    description: "A lean, hungry wolf."
    dialogue:
      - "Grr."
    hp: 30
    attack: 8
    defense: 3
    counter: 2
    difficulty: "easy"

players:
  hero:
    name: "Hero"
    hp: 100
    weapon:
      name: "Sword"
      critical: 0.1
    attack: 20
    defense: 10
    respawn:
      hp: 50
      location: "village"

quests:
  fetch_potion:
    name: "Fetch the Potion"
    giver: "elder"
    description: "Bring back a potion from the forest."
    objective:
      type: "fetch"
      item: "potion"
      deliver_to: "village"
    reward:
      type: "item"
      value: "potion"

  slay_wolf:
    name: "Slay the Wolf"
    giver: "elder"
    description: "Defeat the wolf terrorizing the forest."
    objective:
      type: "defeat"
      enemy: "wolf"
    reward:
      type: "item"
      value: "potion"
