# Fixture : erreurs au niveau des quests (voir quest.go). "giver", "potion"
# et "foe" sont volontairement valides pour isoler chaque erreur testée.

npcs:
  giver:
    name: "Giver"
    role: "quest_giver"
    description: "Hands out every quest in this fixture."
    dialogue:
      - "Here's a task for you."

items:
  potion:
    name: "Potion"
    description: "A reward item."
    obtainable: true

enemies:
  foe:
    name: "Foe"
    description: "A target for defeat objectives."
    dialogue:
      - "..."
    difficulty: "easy"
    hp: 10
    attack: 1
    defense: 1
    counter: 1

quests:
  "":
    name: ""
    giver: ""
    description: ""
    objective:
      type: ""
    reward:
      type: ""

  duplicate_a:
    name: "Same Quest"
    giver: "giver"
    description: "A first quest with a shared name."
    objective:
      type: "fetch"
      item: "potion"
    reward:
      type: "item"
      value: "potion"

  duplicate_b:
    name: "Same Quest"
    giver: "giver"
    description: "A second quest with the same shared name."
    objective:
      type: "fetch"
      item: "potion"
    reward:
      type: "item"
      value: "potion"

  unknown_giver:
    name: "Unknown Giver"
    giver: "ghost"
    description: "A quest given by someone who doesn't exist."
    objective:
      type: "fetch"
      item: "potion"
    reward:
      type: "item"
      value: "potion"

  bad_fetch:
    name: "Bad Fetch"
    giver: "giver"
    description: "A fetch quest with a bad item and a bad delivery location."
    objective:
      type: "fetch"
      item: "unknown_item"
      deliver_to: "nowhere"
    reward:
      type: "item"
      value: "potion"

  empty_fetch_item:
    name: "Empty Fetch Item"
    giver: "giver"
    description: "A fetch quest that forgot to name its item."
    objective:
      type: "fetch"
    reward:
      type: "item"
      value: "potion"

  bad_defeat:
    name: "Bad Defeat"
    giver: "giver"
    description: "A defeat quest targeting an enemy that doesn't exist."
    objective:
      type: "defeat"
      enemy: "unknown_enemy"
    reward:
      type: "item"
      value: "potion"

  empty_defeat_enemy:
    name: "Empty Defeat Enemy"
    giver: "giver"
    description: "A defeat quest that forgot to name its enemy."
    objective:
      type: "defeat"
    reward:
      type: "item"
      value: "potion"

  unknown_objective_type:
    name: "Weird Objective"
    giver: "giver"
    description: "A quest with an objective type nobody recognizes."
    objective:
      type: "explore"
    reward:
      type: "item"
      value: "potion"

  bad_reward:
    name: "Bad Reward"
    giver: "giver"
    description: "A quest whose reward item doesn't exist."
    objective:
      type: "defeat"
      enemy: "foe"
    reward:
      type: "item"
      value: "unknown_item"

  empty_reward_value:
    name: "Empty Reward Value"
    giver: "giver"
    description: "A quest that forgot to name its reward value."
    objective:
      type: "defeat"
      enemy: "foe"
    reward:
      type: "item"

  unknown_reward_type:
    name: "Weird Reward"
    giver: "giver"
    description: "A quest with a reward type nobody recognizes."
    objective:
      type: "defeat"
      enemy: "foe"
    reward:
      type: "gold"
      value: "100"
