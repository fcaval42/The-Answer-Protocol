# Fixture : erreurs au niveau des players (voir player.go). somewhere/elsewhere
# forment une petite boucle valide, uniquement pour fournir une location de
# respawn correcte à comparer avec le cas "does_not_exist".

world:
  locations:
    somewhere:
      name: "Somewhere"
      description: "Minimal scaffolding room so a valid respawn location exists."
      exits:
        away: "elsewhere"

    elsewhere:
      name: "Elsewhere"
      description: "The other half of the minimal scaffolding loop."
      exits:
        back: "somewhere"

players:
  "":
    name: ""
    hp: -1
    attack: -2
    defense: -3
    weapon:
      name: ""
      critical: -0.1
    respawn:
      hp: -5
      location: ""

  duplicate_a:
    name: "Same Player"
    hp: 10
    attack: 1
    defense: 1
    weapon:
      name: "Sword"
      critical: 0.1
    respawn:
      hp: 10
      location: "somewhere"

  duplicate_b:
    name: "Same Player"
    hp: 10
    attack: 1
    defense: 1
    weapon:
      name: "Sword"
      critical: 0.1
    respawn:
      hp: 10
      location: "somewhere"

  bad_respawn_location:
    name: "Nowhere"
    hp: 10
    attack: 1
    defense: 1
    weapon:
      name: "Sword"
      critical: 0.1
    respawn:
      hp: 10
      location: "does_not_exist"

  bad_weapon_critical_high:
    name: "Overcrit"
    hp: 10
    attack: 1
    defense: 1
    weapon:
      name: "Sword"
      critical: 1.5
    respawn:
      hp: 10
      location: "somewhere"
