# Fixture : une carte en ligne droite (a -> b -> c) sans aucune boucle.
# c est un vrai cul-de-sac (aucune sortie), ce qui déclenche aussi "has no
# exits" en plus de "the world has no loop" — les deux sont attendues.

world:
  locations:
    a:
      name: "A"
      description: "The starting room of a straight line."
      exits:
        east: "b"

    b:
      name: "B"
      description: "The middle room of a straight line."
      exits:
        east: "c"

    c:
      name: "C"
      description: "A true dead end with no way back."
      exits: {}
