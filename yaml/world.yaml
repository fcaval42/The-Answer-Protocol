      hp: 50
      location: "Lumière"

  Lune:
    name: "Lune"
    hp: 100
    weapon:
      name: "Lumerim"
      critical: 0.1
    attack: 38
    defense: 12
    respawn:
      hp: 50
      location: "Lumière"

  Maëlle:
    name: "Maëlle"
    hp: 130
    weapon:
      name: "Médalum"
      critical: 0.1
    attack: 50
    defense: 25
    respawn:
      hp: 50
      location: "Lumière"

  Sciel:
    name: "Sciel"
    hp: 90
    weapon:
      name: "Forestion"
      critical: 0.1
    attack: 22
    defense: 35
    respawn:
      hp: 50
      location: "Lumière"

  Verso:
    name: "Verso"
    hp: 100
    weapon:
      name: "Blodam"
      critical: 0.1
    attack: 45
    defense: 8
    respawn:
      hp: 50
      location: "Lumière"


quests:
  Nevron_blanc:
    name: "Lumen rursus accendens"
    giver: "Sophie"
    description: "Chercher la Lumière pour rallumer sa lampe."
    objective:
      type: "fetch"
      item: "Lumina"
      deliver_to: "Vallées_fleuries"
    reward:
      type: "item"
      value: "Lighterim"

  Florrie:
    name: "Florrie"
    giver: "Esquie"
    description: "Aller combattre Renoir pour libérer Florrie"
    objective:
      type: "defeat"
      enemy: "Renoir"
    reward:
      type: "item"
      value: "Brise_barrière"
